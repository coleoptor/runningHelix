<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helix Training - Objectifs Course</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        helix: {
                            orange: '#d97706',
                            dark: '#111827',
                            card: '#f9fafb'
                        }
                    }
                }
            }
        }
    </script>
    <!-- SDK Client Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">

    <div>
        <!-- En-tête avec logo -->
        <header class="border-b border-gray-200 bg-white sticky top-0 z-20 shadow-sm">
            <div class="max-w-3xl mx-auto px-4 py-3 flex flex-col sm:flex-row items-center justify-between gap-3">
                <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-start">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full overflow-hidden border border-amber-600 shadow-sm flex-shrink-0 bg-amber-600 flex items-center justify-center font-bold text-white text-xs">
                            <img src="1000091068.jpg" alt="Helix" class="w-full h-full object-cover" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                            <div style="display:none;" class="w-full h-full items-center justify-center bg-amber-600 text-[10px] tracking-tighter">HELIX</div>
                        </div>
                        <div>
                            <h1 class="text-base font-bold tracking-tight text-gray-900 leading-tight">HELIX TRAINING</h1>
                            <p class="text-[10px] text-amber-600 font-semibold tracking-wider uppercase">Running WOD</p>
                        </div>
                    </div>

                    <!-- Bouton Ajouter mobile en haut -->
                    <button onclick="openModal()" class="sm:hidden bg-amber-600 hover:bg-amber-700 text-white text-xs font-semibold px-3 py-2 rounded-lg shadow-sm transition flex items-center gap-1">
                        + Objectif
                    </button>
                </div>

                <!-- Filtres par distance -->
                <div class="flex items-center gap-1 bg-gray-100 p-1 rounded-lg border border-gray-200 w-full sm:w-auto justify-center">
                    <button onclick="setFilter('Tous')" id="filter-Tous" class="flex-1 sm:flex-initial px-3 py-1 text-xs font-medium rounded-md bg-gray-900 text-white transition">Tous</button>
                    <button onclick="setFilter('5 km')" id="filter-5 km" class="flex-1 sm:flex-initial px-3 py-1 text-xs font-medium rounded-md text-gray-600 hover:text-gray-900 transition">5 km</button>
                    <button onclick="setFilter('10 km')" id="filter-10 km" class="flex-1 sm:flex-initial px-3 py-1 text-xs font-medium rounded-md text-gray-600 hover:text-gray-900 transition">10 km</button>
                    <button onclick="setFilter('20 km')" id="filter-20 km" class="flex-1 sm:flex-initial px-3 py-1 text-xs font-medium rounded-md text-gray-600 hover:text-gray-900 transition">20 km</button>
                </div>

                <!-- Bouton Ajouter Desktop -->
                <button onclick="openModal()" class="hidden sm:flex bg-amber-600 hover:bg-amber-700 text-white text-xs font-semibold px-4 py-2 rounded-lg shadow-sm transition items-center gap-1.5">
                    + Ajouter mon objectif
                </button>
            </div>
        </header>

        <!-- Contenu Principal -->
        <main class="max-w-3xl mx-auto px-4 py-6 space-y-4">
            
            <!-- Sélecteur de Course -->
            <div class="bg-white p-3.5 rounded-xl border border-gray-200 shadow-sm flex items-center justify-between gap-3">
                <div class="flex items-center gap-2.5 w-full">
                    <span class="text-xs font-semibold uppercase text-gray-400 tracking-wider flex-shrink-0">Course :</span>
                    <select id="race-selector" onchange="changeRace(this.value)" class="text-sm font-bold text-gray-900 bg-transparent focus:outline-none cursor-pointer w-full">
                        <option value="Run4them 2026">Run4them 2026</option>
                    </select>
                </div>
            </div>

            <!-- Liste des cartes -->
            <div id="runners-container" class="space-y-3">
                <div class="bg-white p-6 rounded-xl border border-gray-200 text-center text-gray-400 text-sm shadow-sm">
                    Chargement des données...
                </div>
            </div>
        </main>
    </div>

    <!-- Fenêtre Modale (Popup) pour le Formulaire -->
    <div id="runner-modal" class="fixed inset-0 bg-black/50 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 relative border border-gray-100 my-auto">
            <div class="flex items-center justify-between mb-4">
                <h2 id="form-title" class="text-base font-bold text-gray-900">Ajouter votre objectif</h2>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold px-2 py-1">&times;</button>
            </div>

            <form id="runner-form" onsubmit="handleSaveRunner(event)" class="space-y-4">
                <input type="hidden" id="runner-id" value="">

                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Prénom ou Pseudonyme</label>
                    <input type="text" id="runner-name" required placeholder="Ex: Thomas" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Distance</label>
                    <select id="runner-distance" onchange="updateTimeChoices()" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm bg-white">
                        <option value="5 km">5 km</option>
                        <option value="10 km" selected>10 km</option>
                        <option value="20 km">20 km</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Choix de l'objectif de temps</label>
                    <select id="runner-time-choice" onchange="toggleCustomTime()" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm bg-white mb-2">
                        <!-- Options dynamiques -->
                    </select>
                </div>

                <div id="custom-time-container" class="hidden">
                    <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Temps exact (HH:MM:SS ou MM:SS)</label>
                    <input type="text" id="runner-custom-time" placeholder="Ex: 48:30" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm">
                </div>

                <div class="flex gap-2 pt-2">
                    <button type="submit" id="submit-btn" class="flex-1 bg-gray-900 hover:bg-black text-white font-medium py-2.5 rounded-lg transition text-xs shadow-sm">
                        Enregistrer
                    </button>
                    <button type="button" onclick="closeModal()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium px-4 py-2.5 rounded-lg transition text-xs">
                        Annuler
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="py-4 text-center text-[11px] text-gray-400 border-t border-gray-200 bg-white">
        Helix Training Running WOD • Synchronisé via Supabase
    </footer>

    <!-- Script de logique -->
    <script>
        const SUPABASE_URL = 'https://ctjzbigpqewfmmpaioyp.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0anpiaWdwcWV3Zm1tcGFpb3lwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2NjI5NTQsImV4cCI6MjEwNzIzODk1NH0.wBfYU1Pq3GY1L2TCA6jaCHqVZjemSBHr7-X3ndcEwWU';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentFilter = 'Tous';
        let currentRace = 'Run4them 2026';
        let runnersData = [];

        // Ajout de l'option "Finisher" dans les presets
        const timePresets = {
            '5 km': [
                { label: '25:00 (5:00 /km)', value: '25:00' },
                { label: '30:00 (6:00 /km)', value: '30:00' },
                { label: '35:00 (7:00 /km)', value: '35:00' },
                { label: 'Finisher (juste finir)', value: 'Finisher' },
                { label: 'Saisir un temps exact...', value: 'custom' }
            ],
            '10 km': [
                { label: '50:00 (5:00 /km)', value: '50:00' },
                { label: '1:00:00 (6:00 /km)', value: '1:00:00' },
                { label: '1:10:00 (7:00 /km)', value: '1:10:00' },
                { label: 'Finisher (juste finir)', value: 'Finisher' },
                { label: 'Saisir un temps exact...', value: 'custom' }
            ],
            '20 km': [
                { label: '1:40:00 (5:00 /km)', value: '1:40:00' },
                { label: '2:00:00 (6:00 /km)', value: '2:00:00' },
                { label: '2:20:00 (7:00 /km)', value: '2:20:00' },
                { label: 'Finisher (juste finir)', value: 'Finisher' },
                { label: 'Saisir un temps exact...', value: 'custom' }
            ]
        };

        window.addEventListener('DOMContentLoaded', () => {
            updateTimeChoices();
            fetchRunners();
        });

        function changeRace(raceName) {
            currentRace = raceName;
            renderCards();
        }

        function updateTimeChoices() {
            const distance = document.getElementById('runner-distance').value;
            const select = document.getElementById('runner-time-choice');
            const choices = timePresets[distance] || [];
            
            select.innerHTML = choices.map(c => `<option value="${c.value}">${c.label}</option>`).join('');
            toggleCustomTime();
        }

        async function fetchRunners() {
            const { data, error } = await supabaseClient
                .from('runners')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Erreur lors du chargement :', error);
                document.getElementById('runners-container').innerHTML = `<div class="bg-white p-6 rounded-xl border border-red-200 text-center text-red-500 text-sm">Erreur de connexion à la base de données.</div>`;
                return;
            }

            runnersData = data || [];
            renderCards();
        }

        function setFilter(distance) {
            currentFilter = distance;
            ['Tous', '5 km', '10 km', '20 km'].forEach(d => {
                const btn = document.getElementById(`filter-${d}`);
                if (d === distance) {
                    btn.className = "flex-1 sm:flex-initial px-3 py-1 text-xs font-medium rounded-md bg-gray-900 text-white transition";
                } else {
                    btn.className = "flex-1 sm:flex-initial px-3 py-1 text-xs font-medium rounded-md text-gray-600 hover:text-gray-900 transition";
                }
            });
            renderCards();
        }

        function toggleCustomTime() {
            const val = document.getElementById('runner-time-choice').value;
            const container = document.getElementById('custom-time-container');
            if (val === 'custom') {
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
            }
        }

        function parseDistanceKm(distStr) {
            return parseFloat(distStr.replace(' km', ''));
        }

        function parseTimeToSeconds(timeStr) {
            const parts = timeStr.split(':').map(Number);
            if (parts.length === 3) {
                return parts[0] * 3600 + parts[1] * 60 + parts[2];
            } else if (parts.length === 2) {
                return parts[0] * 60 + parts[1];
            }
            return 0;
        }

        function openModal() {
            resetForm();
            document.getElementById('runner-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('runner-modal').classList.add('hidden');
            resetForm();
        }

        async function handleSaveRunner(e) {
            e.preventDefault();
            const id = document.getElementById('runner-id').value;
            const name = document.getElementById('runner-name').value.trim();
            const distance = document.getElementById('runner-distance').value;
            const timeChoice = document.getElementById('runner-time-choice').value;
            
            let finalTime = '';
            let paceDisplay = '-';

            if (timeChoice === 'custom') {
                finalTime = document.getElementById('runner-custom-time').value.trim();
                if (!finalTime) {
                    alert('Veuillez saisir un temps exact.');
                    return;
                }
            } else {
                finalTime = timeChoice.split(' ')[0];
            }

            // Si c'est "Finisher", pas de calcul d'allure
            if (finalTime !== 'Finisher') {
                const distKm = parseDistanceKm(distance);
                const totalSeconds = parseTimeToSeconds(finalTime);
                if (totalSeconds > 0) {
                    const paceSec = Math.round(totalSeconds / distKm);
                    const pMins = Math.floor(paceSec / 60);
                    const pSecs = paceSec % 60;
                    paceDisplay = `${pMins}:${pSecs < 10 ? '0' : ''}${pSecs} /km`;
                }
            }

            const payload = {
                name: name,
                distance: distance,
                time: finalTime,
                pace_type: paceDisplay,
                race: currentRace
            };

            let error;
            if (id) {
                const queryId = !isNaN(id) ? Number(id) : id;
                ({ error } = await supabaseClient.from('runners').update(payload).eq('id', queryId));
            } else {
                ({ error } = await supabaseClient.from('runners').insert([payload]));
            }

            if (error) {
                alert('Erreur lors de l’enregistrement : ' + error.message);
                return;
            }

            closeModal();
            fetchRunners();
        }

        function editRunner(id) {
            const runner = runnersData.find(r => String(r.id) === String(id));
            if (!runner) {
                alert("Impossible de trouver les données de cette ligne.");
                return;
            }

            document.getElementById('runner-id').value = runner.id;
            document.getElementById('runner-name').value = runner.name;
            document.getElementById('runner-distance').value = runner.distance;
            
            updateTimeChoices();

            const select = document.getElementById('runner-time-choice');
            const hasOption = Array.from(select.options).some(opt => opt.value === runner.time);

            if (hasOption) {
                select.value = runner.time;
            } else {
                select.value = 'custom';
                document.getElementById('runner-custom-time').value = runner.time;
            }

            toggleCustomTime();

            document.getElementById('form-title').innerText = "Modifier l'objectif";
            document.getElementById('submit-btn').innerText = "Mettre à jour";
            document.getElementById('runner-modal').classList.remove('hidden');
        }

        async function deleteRunner(id) {
            if (!confirm("Êtes-vous sûr de vouloir supprimer cet objectif ?")) return;

            const queryId = !isNaN(id) ? Number(id) : id;
            const { error } = await supabaseClient.from('runners').delete().eq('id', queryId);

            if (error) {
                alert('Erreur lors de la suppression : ' + error.message);
                return;
            }

            fetchRunners();
        }

        function resetForm() {
            document.getElementById('runner-form').reset();
            document.getElementById('runner-id').value = '';
            document.getElementById('form-title').innerText = "Ajouter votre objectif";
            document.getElementById('submit-btn').innerText = "Enregistrer";
            updateTimeChoices();
        }

        function renderCards() {
            const container = document.getElementById('runners-container');
            
            const filtered = runnersData.filter(r => {
                const matchRace = (r.race || 'Run4them 2026') === currentRace;
                const matchDist = currentFilter === 'Tous' || r.distance === currentFilter;
                return matchRace && matchDist;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="bg-white p-6 rounded-xl border border-gray-200 text-center text-gray-400 text-sm shadow-sm">Aucun participant enregistré pour cette course.</div>`;
                return;
            }

            container.innerHTML = filtered.map(r => `
                <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm flex items-center justify-between gap-3 transition hover:border-amber-300">
                    <div class="space-y-1">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-gray-900 text-base">${escapeHtml(r.name)}</span>
                            <span class="px-2 py-0.5 bg-amber-50 text-amber-800 rounded text-[11px] font-semibold">${r.distance}</span>
                        </div>
                        <div class="text-xs text-gray-500 flex items-center gap-3">
                            <span>Allure : <strong class="text-gray-700">${r.pace_type || '-'}</strong></span>
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="text-right">
                            <div class="text-xs text-gray-400 uppercase font-medium">Temps</div>
                            <div class="text-lg font-extrabold text-gray-900">${r.time}</div>
                        </div>
                        <div class="flex flex-col gap-1 border-l border-gray-100 pl-3">
                            <button onclick="editRunner('${r.id}')" title="Modifier" class="p-1 text-gray-400 hover:text-amber-600 transition">
                                ✏️
                            </button>
                            <button onclick="deleteRunner('${r.id}')" title="Supprimer" class="p-1 text-gray-400 hover:text-red-600 transition">
                                🗑️
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
